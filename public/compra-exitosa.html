<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Exitosa! | PianoLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --border: #2a2a2a;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --success: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(180deg, rgba(99,102,241,0.1) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .success-card {
            background: var(--bg-card);
            border: 2px solid var(--success);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-out;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .success-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--success);
        }

        .success-message {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .purchase-details {
            background: rgba(74, 222, 128, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: var(--text-muted); }
        .detail-value { font-weight: 600; }

        .btn-primary {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99,102,241,0.3);
        }

        .btn-secondary {
            display: inline-block;
            padding: 14px 30px;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }

        .loading {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">🎹 PianoLink</a>
    </header>

    <main class="main">
        <div class="success-card" id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Confirmando tu compra...</p>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        async function confirmPurchase() {
            if (!sessionId) {
                showError('No se encontró información de la compra');
                return;
            }

            try {
                // Primero verificar estado
                const statusRes = await fetch(`/api/class-purchase/status/${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const statusData = await statusRes.json();

                if (statusData.status !== 'paid') {
                    showError('El pago no fue completado');
                    return;
                }

                // Confirmar y procesar
                const confirmRes = await fetch('/api/class-purchase/confirm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ sessionId })
                });
                const confirmData = await confirmRes.json();

                if (confirmData.success) {
                    showSuccess(statusData.metadata, confirmData);
                } else {
                    // Si ya fue procesado por webhook, igual mostramos éxito
                    showSuccess(statusData.metadata, { classesAdded: parseInt(statusData.metadata.classes) });
                }

            } catch (error) {
                console.error('Error:', error);
                showError('Error al confirmar la compra. Contacta a soporte.');
            }
        }

        function showSuccess(metadata, confirmData) {
            document.getElementById('content').innerHTML = `
                <div class="success-icon">🎉</div>
                <h1 class="success-title">¡Compra Exitosa!</h1>
                <p class="success-message">
                    Has adquirido <strong>${confirmData.classesAdded} ${confirmData.classesAdded === 1 ? 'clase' : 'clases'}</strong> de piano.
                    Ya puedes agendar tu primera clase desde tu panel.
                </p>
                
                <div class="purchase-details">
                    <div class="detail-row">
                        <span class="detail-label">Clases compradas</span>
                        <span class="detail-value">${confirmData.classesAdded}</span>
                    </div>
                    ${metadata.discountPercent > 0 ? `
                    <div class="detail-row">
                        <span class="detail-label">Descuento aplicado</span>
                        <span class="detail-value">${metadata.discountPercent}%</span>
                    </div>
                    ` : ''}
                </div>

                <a href="/dashboard.html" class="btn-primary">📅 Agendar mi primera clase</a>
                <br><br>
                <a href="/profesores" class="btn-secondary">Ver más profesores</a>
            `;
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="success-icon">😔</div>
                <h1 class="success-title" style="color: #ef4444;">Algo salió mal</h1>
                <p class="success-message">${message}</p>
                <a href="/dashboard.html" class="btn-primary">Ir a mi panel</a>
            `;
        }

        confirmPurchase();
    </script>
</body>
</html>
