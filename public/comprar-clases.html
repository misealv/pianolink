<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar Clases | PianoLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --border: #2a2a2a;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(99,102,241,0.1) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
        }
        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--accent-light); }

        /* Main */
        .main {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .page-subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        /* Teacher Info */
        .teacher-info {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .teacher-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
        }
        .teacher-photo-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: white;
        }
        .teacher-details h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .teacher-details p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .option-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .option-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }
        .option-card.selected {
            border-color: var(--accent);
            background: rgba(99,102,241,0.1);
        }
        .option-card.selected::after {
            content: '✓';
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--accent);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .option-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .option-classes {
            font-size: 24px;
            font-weight: 800;
        }
        .option-discount {
            background: var(--warning);
            color: #000;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .option-price {
            font-size: 32px;
            font-weight: 800;
            color: var(--success);
            margin-bottom: 5px;
        }
        .option-price span {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
        }
        .option-perclass {
            font-size: 13px;
            color: var(--text-muted);
        }
        .option-savings {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--success);
            font-weight: 600;
        }

        /* Trial Banner */
        .trial-banner {
            background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.15));
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }
        .trial-banner h3 {
            color: var(--warning);
            font-size: 16px;
            margin-bottom: 8px;
        }
        .trial-banner p {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Summary */
        .summary-card {
            background: var(--bg-card);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .summary-title {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .summary-row:last-child { border-bottom: none; }
        .summary-row.total {
            font-size: 20px;
            font-weight: 700;
            color: var(--success);
            border-top: 2px solid var(--border);
            margin-top: 10px;
            padding-top: 15px;
        }

        /* Button */
        .btn-checkout {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-checkout:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99,102,241,0.3);
        }
        .btn-checkout:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secure-text {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Login Required */
        .login-required {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }
        .login-required h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }
        .login-required p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .btn-login {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }

        /* Loading & Error */
        .loading, .error {
            text-align: center;
            padding: 100px 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 600px) {
            .main { padding: 20px; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">🎹 PianoLink</a>
            <a href="/profesores" class="back-link">← Ver otros profesores</a>
        </div>
    </header>

    <main class="main" id="mainContent">
        <div class="loading">
            <div class="spinner"></div>
            <p>Cargando...</p>
        </div>
    </main>

    <script>
        // Obtener parámetros
        const urlParams = new URLSearchParams(window.location.search);
        const teacherSlug = urlParams.get('profesor');
        
        let teacher = null;
        let selectedOption = null;
        let currentUser = null;

        // Verificar sesión
        async function checkSession() {
            const token = localStorage.getItem('token');
            if (!token) {
                console.log('No hay token en localStorage');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    console.log('Sesión activa:', currentUser?.email);
                } else {
                    console.log('Token inválido, status:', response.status);
                }
            } catch (e) {
                console.log('Error verificando sesión:', e);
            }
        }

        // Cargar profesor
        async function loadTeacher() {
            if (!teacherSlug) {
                showError('No se especificó profesor');
                return;
            }

            try {
                const response = await fetch(`/api/teacher-profile/public/${teacherSlug}`);
                const data = await response.json();
                
                if (data.success) {
                    teacher = data.teacher;
                    await checkSession();
                    renderPage();
                } else {
                    showError(data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión');
            }
        }

        // Renderizar página
        function renderPage() {
            const main = document.getElementById('mainContent');
            
            // Construir opciones de compra
            const options = buildOptions();
            
            let optionsHTML = options.map((opt, idx) => `
                <div class="option-card" onclick="selectOption(${idx})" data-index="${idx}">
                    <div class="option-header">
                        <span class="option-classes">${opt.classes} ${opt.classes === 1 ? 'clase' : 'clases'}</span>
                        ${opt.discount > 0 ? `<span class="option-discount">-${opt.discount}%</span>` : ''}
                    </div>
                    <div class="option-price">$${opt.total.toFixed(0)} <span>USD</span></div>
                    <div class="option-perclass">$${opt.pricePerClass.toFixed(2)} por clase</div>
                    ${opt.savings > 0 ? `<div class="option-savings">Ahorras $${opt.savings.toFixed(0)}</div>` : ''}
                </div>
            `).join('');

            main.innerHTML = `
                <h1 class="page-title">Comprar Clases de Piano</h1>
                <p class="page-subtitle">Selecciona la cantidad de clases que deseas adquirir</p>

                <div class="teacher-info">
                    ${teacher.photo 
                        ? `<img src="${teacher.photo}" class="teacher-photo" alt="${teacher.name}">`
                        : `<div class="teacher-photo-placeholder">${teacher.name.charAt(0)}</div>`
                    }
                    <div class="teacher-details">
                        <h2>${teacher.name}</h2>
                        <p>Profesor de Piano • $${teacher.pricePerClass.toFixed(0)} USD por clase</p>
                    </div>
                </div>

                ${teacher.acceptsTrialClass ? `
                    <div class="trial-banner">
                        <h3>🎁 ¿Tienes un kit de bienvenida?</h3>
                        <p>Tu clase de prueba ya está incluida. Agenda directamente desde tu panel.</p>
                    </div>
                ` : ''}

                <div class="options-grid">
                    ${optionsHTML}
                </div>

                <div class="summary-card" id="summaryCard" style="display: none;">
                    <div class="summary-title">Resumen de tu compra</div>
                    <div class="summary-row">
                        <span>Profesor</span>
                        <span>${teacher.name}</span>
                    </div>
                    <div class="summary-row">
                        <span id="summaryClasses">-</span>
                        <span id="summaryPrice">-</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="summaryTotal">-</span>
                    </div>
                </div>

                ${currentUser ? `
                    <button class="btn-checkout" id="btnCheckout" disabled onclick="checkout()">
                        Selecciona una opción
                    </button>
                    <p class="secure-text">🔒 Pago seguro con Stripe</p>
                ` : `
                    <div class="login-required">
                        <h2>Inicia sesión para continuar</h2>
                        <p>Necesitas una cuenta para comprar clases</p>
                        <a href="/login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}" class="btn-login">
                            Iniciar Sesión
                        </a>
                        <p style="margin-top: 12px; font-size: 13px; color: var(--text-muted);">
                            ¿No tienes cuenta? <a href="/registro.html" style="color: var(--accent-light);">Regístrate aquí</a>
                        </p>
                    </div>
                `}
                    </div>
                `}
            `;
        }

        // Construir opciones (clase individual + paquetes)
        function buildOptions() {
            const options = [];
            const basePrice = teacher.pricePerClass;

            // Opción: 1 clase
            options.push({
                classes: 1,
                discount: 0,
                pricePerClass: basePrice,
                total: basePrice,
                savings: 0
            });

            // Paquetes del profesor
            if (teacher.packages && teacher.packages.length > 0) {
                teacher.packages.forEach(pkg => {
                    const discountedPrice = basePrice * (1 - pkg.discountPercent / 100);
                    const total = discountedPrice * pkg.classes;
                    const savings = (basePrice * pkg.classes) - total;
                    
                    options.push({
                        classes: pkg.classes,
                        discount: pkg.discountPercent,
                        pricePerClass: discountedPrice,
                        total: total,
                        savings: savings
                    });
                });
            }

            return options;
        }

        // Seleccionar opción
        function selectOption(index) {
            selectedOption = buildOptions()[index];
            
            // Actualizar UI
            document.querySelectorAll('.option-card').forEach((card, i) => {
                card.classList.toggle('selected', i === index);
            });

            // Mostrar resumen
            const summary = document.getElementById('summaryCard');
            summary.style.display = 'block';
            
            document.getElementById('summaryClasses').textContent = 
                `${selectedOption.classes} ${selectedOption.classes === 1 ? 'clase' : 'clases'}`;
            document.getElementById('summaryPrice').textContent = 
                `$${selectedOption.total.toFixed(0)} USD`;
            document.getElementById('summaryTotal').textContent = 
                `$${selectedOption.total.toFixed(0)} USD`;

            // Activar botón
            const btn = document.getElementById('btnCheckout');
            if (btn) {
                btn.disabled = false;
                btn.textContent = `💳 Pagar $${selectedOption.total.toFixed(0)} USD`;
            }
        }

        // Checkout con Stripe
        async function checkout() {
            const btn = document.getElementById('btnCheckout');
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            try {
                const response = await fetch('/api/class-purchase/create-checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        teacherSlug: teacherSlug,
                        classes: selectedOption.classes,
                        discountPercent: selectedOption.discount,
                        total: selectedOption.total
                    })
                });

                const data = await response.json();
                
                if (data.success && data.sessionUrl) {
                    window.location.href = data.sessionUrl;
                } else {
                    alert(data.error || 'Error al crear sesión de pago');
                    btn.disabled = false;
                    btn.textContent = `💳 Pagar $${selectedOption.total.toFixed(0)} USD`;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión');
                btn.disabled = false;
                btn.textContent = `💳 Pagar $${selectedOption.total.toFixed(0)} USD`;
            }
        }

        // Mostrar error
        function showError(message) {
            document.getElementById('mainContent').innerHTML = `
                <div class="error">
                    <h2>😔 Error</h2>
                    <p>${message || 'No se pudo cargar la información.'}</p>
                    <a href="/profesores" class="btn-login" style="display: inline-block; margin-top: 20px;">Ver profesores</a>
                </div>
            `;
        }

        // Iniciar
        loadTeacher();
    </script>
</body>
</html>
