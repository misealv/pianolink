<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel | Piano Link</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #ff764d;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-name {
            font-size: 14px;
            color: var(--text-muted);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Main Content */
        .main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Welcome Section */
        .welcome {
            margin-bottom: 32px;
        }

        .welcome h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .stat-number {
            font-size: 42px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card.success .stat-number { color: var(--success); }
        .stat-card.warning .stat-number { color: var(--warning); }

        /* Section Title */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Students Grid */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .student-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .student-avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent), #ff9f7e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .student-age {
            font-size: 13px;
            color: var(--text-muted);
        }

        .student-classes {
            text-align: right;
        }

        .classes-count {
            font-size: 24px;
            font-weight: 700;
            color: var(--success);
        }

        .classes-count.low { color: var(--warning); }
        .classes-count.empty { color: var(--danger); }

        .classes-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #ff9f7e;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Payment Status */
        .payment-status {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .status-badge.pending {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        /* Billing History */
        .billing-table {
            width: 100%;
            border-collapse: collapse;
        }

        .billing-table th,
        .billing-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .billing-table th {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .billing-table td {
            font-size: 14px;
        }

        .billing-status {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .billing-status.approved {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .billing-status.pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        /* Orders/Tracking Section */
        .orders-section {
            margin-bottom: 32px;
        }

        .order-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .order-date {
            font-size: 13px;
            color: var(--text-muted);
        }

        .shipping-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shipping-status.pending_payment {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .shipping-status.processing {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .shipping-status.shipped {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .shipping-status.delivered {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        /* Products List */
        .products-list {
            margin-bottom: 20px;
        }

        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .product-item:last-child {
            border-bottom: none;
        }

        .product-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-icon {
            width: 36px;
            height: 36px;
            background: var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 500;
        }

        .product-detail {
            font-size: 12px;
            color: var(--text-muted);
        }

        .product-type {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            background: var(--border);
            color: var(--text-muted);
        }

        .product-type.physical {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .product-type.service {
            background: rgba(139, 92, 246, 0.15);
            color: #8b5cf6;
        }

        /* Tracking Section */
        .tracking-box {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            padding: 16px;
        }

        .tracking-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #3b82f6;
        }

        .tracking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .tracking-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tracking-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tracking-value {
            font-size: 14px;
            font-weight: 500;
        }

        .tracking-link {
            color: #3b82f6;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .tracking-link:hover {
            text-decoration: underline;
        }

        .btn-confirm-receipt {
            margin-top: 16px;
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-confirm-receipt:hover {
            background: #16a34a;
            transform: translateY(-1px);
        }

        .btn-confirm-receipt:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        /* Timeline (Shipping Progress) */
        .shipping-timeline {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            position: relative;
        }

        .shipping-timeline::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 15%;
            right: 15%;
            height: 3px;
            background: var(--border);
        }

        .timeline-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 1;
            flex: 1;
        }

        .timeline-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .timeline-dot.active {
            background: #3b82f6;
            color: white;
        }

        .timeline-dot.completed {
            background: var(--success);
            color: white;
        }

        .timeline-label {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        .timeline-step.active .timeline-label,
        .timeline-step.completed .timeline-label {
            color: var(--text);
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 12px;
            }

            .welcome h1 {
                font-size: 22px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .stat-number {
                font-size: 32px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .billing-table {
                font-size: 12px;
            }

            .billing-table th,
            .billing-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">🎹 Piano Link</div>
        <div class="user-info">
            <span class="user-name" id="userName">Cargando...</span>
            <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main" id="mainContent">
        <div class="loading">
            <div class="spinner"></div>
            <p>Cargando tu panel...</p>
        </div>
    </main>

    <script>
        // Verificar autenticación
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        // Cargar datos del usuario
        async function loadDashboard() {
            try {
                const [userRes, paymentsRes, subscriptionRes, ordersRes] = await Promise.all([
                    fetch('/api/client/me', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('/api/client/payments', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('/api/client/subscription', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('/api/client/orders', { headers: { 'Authorization': `Bearer ${token}` } })
                ]);

                if (!userRes.ok) {
                    throw new Error('No autorizado');
                }

                const user = await userRes.json();
                const paymentsData = await paymentsRes.json();
                const subscription = await subscriptionRes.json();
                const ordersData = await ordersRes.json();

                renderDashboard(user, paymentsData.payments, subscription, ordersData.orders);
            } catch (error) {
                console.error('Error cargando dashboard:', error);
                if (error.message === 'No autorizado') {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                }
            }
        }

        function renderDashboard(user, payments, subscription, orders) {
            // Actualizar nombre en header
            document.getElementById('userName').textContent = user.name;

            const students = user.clientData?.managedStudents || [];
            const isGuardian = students.length > 0;

            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <!-- Welcome -->
                <section class="welcome">
                    <h1>¡Hola, ${user.name.split(' ')[0]}! 👋</h1>
                    <p>${isGuardian ? `Gestionas ${students.length} estudiante(s)` : 'Tu panel de clases de piano'}</p>
                </section>

                <!-- Stats -->
                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${user.summary.totalClassesRemaining}</div>
                        <div class="stat-label">Clases disponibles</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-number">${user.summary.totalClassesUsed}</div>
                        <div class="stat-label">Clases realizadas</div>
                    </div>
                    ${isGuardian ? `
                    <div class="stat-card">
                        <div class="stat-number">${students.length}</div>
                        <div class="stat-label">Estudiantes</div>
                    </div>
                    ` : ''}
                </section>

                <!-- Actions -->
                <section class="actions">
                    <a href="#" class="btn btn-primary" onclick="scheduleClass()">
                        📅 Agendar clase
                    </a>
                    <a href="/welcome-kit" class="btn btn-secondary">
                        🛒 Comprar más clases
                    </a>
                    <a href="#" class="btn btn-secondary" onclick="contactSupport()">
                        💬 Soporte WhatsApp
                    </a>
                </section>

                <!-- Students (if guardian) -->
                ${isGuardian ? `
                <section>
                    <h2 class="section-title">👨‍👩‍👧‍👦 Tus estudiantes</h2>
                    <div class="students-grid">
                        ${students.map(s => `
                            <div class="student-card">
                                <div class="student-avatar">${getInitials(s.name)}</div>
                                <div class="student-info">
                                    <div class="student-name">${s.name}</div>
                                    <div class="student-age">${s.age ? s.age + ' años' : 'Edad no especificada'}</div>
                                </div>
                                <div class="student-classes">
                                    <div class="classes-count ${s.classesRemaining === 0 ? 'empty' : s.classesRemaining <= 2 ? 'low' : ''}">${s.classesRemaining}</div>
                                    <div class="classes-label">clases</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
                ` : ''}

                <!-- Orders & Tracking -->
                ${orders && orders.length > 0 ? `
                <section class="orders-section">
                    <h2 class="section-title">📦 Mis pedidos</h2>
                    ${orders.map(order => renderOrder(order)).join('')}
                </section>
                ` : ''}

                <!-- Payment Status -->
                <section class="payment-status">
                    <div class="status-header">
                        <h2 class="section-title" style="margin:0">💳 Estado de cuenta</h2>
                        <span class="status-badge ${subscription.status === 'active' ? 'active' : 'pending'}">
                            ${subscription.status === 'active' ? '✓ Al día' : '⚠ Sin clases'}
                        </span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 14px;">
                        ${subscription.message}
                    </p>
                    ${user.kitPurchaseDate ? `
                    <p style="color: var(--text-muted); font-size: 13px; margin-top: 8px;">
                        Kit adquirido: ${new Date(user.kitPurchaseDate).toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' })}
                    </p>
                    ` : ''}
                </section>

                <!-- Billing History -->
                <section>
                    <h2 class="section-title">📋 Historial de facturación</h2>
                    ${payments.length > 0 ? `
                    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;">
                        <table class="billing-table">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Concepto</th>
                                    <th>Monto</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${payments.map(p => `
                                    <tr>
                                        <td>${new Date(p.date).toLocaleDateString('es-CL')}</td>
                                        <td>${p.type}${p.kitType ? ` (${p.kitType})` : ''}</td>
                                        <td>$${p.amount} ${p.currency}</td>
                                        <td><span class="billing-status ${p.status}">${formatStatus(p.status)}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    ` : `
                    <div class="empty-state">
                        <p>No hay pagos registrados aún</p>
                    </div>
                    `}
                </section>
            `;
        }

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function formatStatus(status) {
            const statusMap = {
                'approved': 'Aprobado',
                'completed': 'Completado',
                'pending': 'Pendiente',
                'rejected': 'Rechazado',
                'COMPLETED': 'Completado'
            };
            return statusMap[status] || status;
        }

        function renderOrder(order) {
            const statusLabels = {
                'pending_payment': 'Pago pendiente',
                'processing': 'Preparando envío',
                'shipped': 'En camino',
                'delivered': 'Entregado'
            };

            const statusIcons = {
                'pending_payment': '⏳',
                'processing': '📦',
                'shipped': '🚚',
                'delivered': '✅'
            };

            const shippingStatus = order.shipping?.status || 'processing';
            const physicalProducts = order.products.filter(p => p.type === 'physical');
            const serviceProducts = order.products.filter(p => p.type === 'service');

            return `
                <div class="order-card">
                    <div class="order-header">
                        <div class="order-info">
                            <h3>Pedido #${order.id.slice(-8).toUpperCase()}</h3>
                            <div class="order-date">
                                ${new Date(order.orderDate).toLocaleDateString('es-CL', { 
                                    day: 'numeric', 
                                    month: 'long', 
                                    year: 'numeric' 
                                })}
                            </div>
                        </div>
                        <div class="shipping-status ${shippingStatus}">
                            ${statusIcons[shippingStatus]} ${statusLabels[shippingStatus]}
                        </div>
                    </div>

                    <!-- Shipping Timeline -->
                    ${physicalProducts.length > 0 ? `
                    <div class="shipping-timeline">
                        <div class="timeline-step ${getTimelineClass('processing', shippingStatus)}">
                            <div class="timeline-dot ${getTimelineClass('processing', shippingStatus)}">📦</div>
                            <div class="timeline-label">Preparando</div>
                        </div>
                        <div class="timeline-step ${getTimelineClass('shipped', shippingStatus)}">
                            <div class="timeline-dot ${getTimelineClass('shipped', shippingStatus)}">🚚</div>
                            <div class="timeline-label">En camino</div>
                        </div>
                        <div class="timeline-step ${getTimelineClass('delivered', shippingStatus)}">
                            <div class="timeline-dot ${getTimelineClass('delivered', shippingStatus)}">🏠</div>
                            <div class="timeline-label">Entregado</div>
                        </div>
                    </div>
                    ` : ''}

                    <!-- Products -->
                    <div class="products-list">
                        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;">
                            Productos del pedido
                        </div>
                        ${physicalProducts.map(p => `
                            <div class="product-item">
                                <div class="product-info">
                                    <div class="product-icon">🎹</div>
                                    <div>
                                        <div class="product-name">${p.name}</div>
                                        ${p.keyboardModel ? `<div class="product-detail">Para: ${p.keyboardModel}</div>` : ''}
                                    </div>
                                </div>
                                <span class="product-type physical">Físico</span>
                            </div>
                        `).join('')}
                        ${serviceProducts.map(p => `
                            <div class="product-item">
                                <div class="product-info">
                                    <div class="product-icon">${p.name.includes('Setup') ? '🔧' : '🎓'}</div>
                                    <div>
                                        <div class="product-name">${p.name}</div>
                                        ${p.scheduledAt ? `<div class="product-detail">Programado: ${new Date(p.scheduledAt).toLocaleDateString('es-CL')}</div>` : ''}
                                    </div>
                                </div>
                                <span class="product-type service">Servicio</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Tracking Info (si hay envío) -->
                    ${order.shipping && order.shipping.trackingNumber ? `
                    <div class="tracking-box">
                        <div class="tracking-header">
                            📍 Información de seguimiento
                        </div>
                        <div class="tracking-details">
                            <div class="tracking-item">
                                <div class="tracking-label">Número de tracking</div>
                                <div class="tracking-value">${order.shipping.trackingNumber}</div>
                            </div>
                            ${order.shipping.carrier ? `
                            <div class="tracking-item">
                                <div class="tracking-label">Courier</div>
                                <div class="tracking-value">${order.shipping.carrier}</div>
                            </div>
                            ` : ''}
                            ${order.shipping.estimatedDelivery ? `
                            <div class="tracking-item">
                                <div class="tracking-label">Entrega estimada</div>
                                <div class="tracking-value">${new Date(order.shipping.estimatedDelivery).toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
                            </div>
                            ` : ''}
                            ${order.shipping.trackingUrl ? `
                            <div class="tracking-item">
                                <div class="tracking-label">Seguir envío</div>
                                <a href="${order.shipping.trackingUrl}" target="_blank" class="tracking-link">
                                    Ver en ${order.shipping.carrier || 'courier'} →
                                </a>
                            </div>
                            ` : ''}
                        </div>
                        ${shippingStatus === 'shipped' ? `
                        <button class="btn-confirm-receipt" onclick="confirmReceipt('${order.id}')">
                            ✓ Confirmar que recibí mi pedido
                        </button>
                        ` : ''}
                        ${order.shipping.deliveredAt ? `
                        <div style="margin-top: 12px; font-size: 13px; color: var(--success);">
                            ✓ Entregado el ${new Date(order.shipping.deliveredAt).toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' })}
                        </div>
                        ` : ''}
                    </div>
                    ` : physicalProducts.length > 0 && shippingStatus === 'processing' ? `
                    <div class="tracking-box" style="background: rgba(245, 158, 11, 0.08); border-color: rgba(245, 158, 11, 0.2);">
                        <div class="tracking-header" style="color: var(--warning);">
                            📦 Tu pedido está siendo preparado
                        </div>
                        <p style="font-size: 14px; color: var(--text-muted);">
                            Te enviaremos el número de seguimiento por email cuando tu pedido sea despachado.
                        </p>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        function getTimelineClass(step, currentStatus) {
            const order = ['pending_payment', 'processing', 'shipped', 'delivered'];
            const stepIndex = order.indexOf(step);
            const currentIndex = order.indexOf(currentStatus);
            
            if (currentIndex > stepIndex) return 'completed';
            if (currentIndex === stepIndex) return 'active';
            return '';
        }

        async function confirmReceipt(orderId) {
            if (!confirm('¿Confirmas que recibiste tu pedido?')) return;
            
            try {
                const res = await fetch(`/api/client/orders/${orderId}/confirm-receipt`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    alert('¡Gracias por confirmar! Disfruta tu equipo 🎹');
                    loadDashboard(); // Recargar datos
                } else {
                    alert('Error al confirmar. Intenta de nuevo.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión');
            }
        }

        function scheduleClass() {
            // TODO: Implementar modal de agendar clase
            alert('Próximamente: Sistema de agendamiento de clases.\n\nPor ahora, contáctanos por WhatsApp para agendar.');
            contactSupport();
        }

        function contactSupport() {
            const phone = '56912345678'; // Cambiar por número real
            const message = encodeURIComponent('Hola! Necesito agendar una clase de piano.');
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }

        // Iniciar
        loadDashboard();
    </script>
</body>
</html>
