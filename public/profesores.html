<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesores | PianoLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --border: #2a2a2a;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(99,102,241,0.1) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            transition: color 0.3s;
        }
        .header-actions a:hover { color: var(--accent-light); }

        /* Main */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        /* Page Title */
        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-title h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .page-title p {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-input {
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .filter-input:focus { border-color: var(--accent); }
        .filter-input::placeholder { color: var(--text-muted); }

        /* Teachers Grid */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        /* Teacher Card */
        .teacher-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }
        .teacher-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(99,102,241,0.15);
        }

        .teacher-header {
            padding: 25px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .teacher-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            flex-shrink: 0;
        }
        .teacher-photo-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        .teacher-info h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .teacher-country {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .teacher-bio {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .teacher-specialties {
            padding: 0 25px 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .specialty-tag {
            background: rgba(99,102,241,0.15);
            color: var(--accent-light);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .teacher-footer {
            padding: 20px 25px;
            background: rgba(255,255,255,0.02);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-info {
            text-align: left;
        }
        .price-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .price-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--success);
        }
        .price-value span {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .trial-badge {
            background: linear-gradient(135deg, var(--warning), #f59e0b);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .btn-view-profile {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-view-profile:hover { opacity: 0.9; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .main { padding: 20px; }
            .filters { flex-direction: column; }
            .filter-input { width: 100%; }
            .teachers-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">🎹 PianoLink</a>
            <div class="header-actions">
                <a href="/mi-kit.html">Mi Kit</a>
                <a href="/login.html">Iniciar Sesión</a>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="page-title">
            <h1>Encuentra tu Profesor Ideal</h1>
            <p>Profesores certificados de piano listos para enseñarte desde cualquier lugar</p>
        </div>

        <div class="filters">
            <input type="text" id="filterSearch" class="filter-input" placeholder="🔍 Buscar por nombre...">
            <select id="filterSpecialty" class="filter-input">
                <option value="">Todas las especialidades</option>
                <option value="clásico">Clásico</option>
                <option value="jazz">Jazz</option>
                <option value="pop">Pop / Moderno</option>
                <option value="niños">Especialista en niños</option>
                <option value="principiantes">Principiantes</option>
                <option value="avanzado">Nivel avanzado</option>
            </select>
            <select id="filterPrice" class="filter-input">
                <option value="">Cualquier precio</option>
                <option value="0-25">Hasta $25/clase</option>
                <option value="25-40">$25 - $40/clase</option>
                <option value="40-999">Más de $40/clase</option>
            </select>
        </div>

        <div id="teachersContainer" class="loading">
            <div class="spinner"></div>
            <p>Cargando profesores...</p>
        </div>
    </main>

    <script>
        let allTeachers = [];

        // Cargar profesores
        async function loadTeachers() {
            try {
                const response = await fetch('/api/teacher-profile/catalog');
                const data = await response.json();
                
                if (data.success) {
                    allTeachers = data.teachers;
                    renderTeachers(allTeachers);
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Error cargando profesores:', error);
                showError();
            }
        }

        // Renderizar profesores
        function renderTeachers(teachers) {
            const container = document.getElementById('teachersContainer');
            
            if (teachers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎹</div>
                        <h3>No se encontraron profesores</h3>
                        <p>Intenta con otros filtros o vuelve más tarde</p>
                    </div>
                `;
                return;
            }

            container.className = 'teachers-grid';
            container.innerHTML = teachers.map(teacher => `
                <div class="teacher-card" onclick="viewProfile('${teacher.slug}')">
                    <div class="teacher-header">
                        ${teacher.photo 
                            ? `<img src="${teacher.photo}" class="teacher-photo" alt="${teacher.name}">`
                            : `<div class="teacher-photo-placeholder">${teacher.name.charAt(0)}</div>`
                        }
                        <div class="teacher-info">
                            <h3>${teacher.name}</h3>
                            <div class="teacher-country">${teacher.country || '🌎 Internacional'}</div>
                            <p class="teacher-bio">${teacher.bio || 'Profesor de piano con experiencia en enseñanza online.'}</p>
                        </div>
                    </div>
                    
                    ${teacher.specialties.length > 0 ? `
                        <div class="teacher-specialties">
                            ${teacher.specialties.slice(0, 3).map(s => `<span class="specialty-tag">${s}</span>`).join('')}
                        </div>
                    ` : ''}
                    
                    <div class="teacher-footer">
                        <div class="price-info">
                            <div class="price-label">Desde</div>
                            <div class="price-value">$${teacher.pricePerClass.toFixed(0)} <span>USD/clase</span></div>
                        </div>
                        ${teacher.acceptsTrialClass ? '<div class="trial-badge">🎁 Clase de prueba</div>' : ''}
                    </div>
                    
                    <button class="btn-view-profile">Ver perfil completo →</button>
                </div>
            `).join('');
        }

        // Ver perfil
        function viewProfile(slug) {
            window.location.href = `/profesor/${slug}`;
        }

        // Mostrar error
        function showError() {
            document.getElementById('teachersContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">😔</div>
                    <h3>Error al cargar</h3>
                    <p>Hubo un problema cargando los profesores. Intenta recargar la página.</p>
                </div>
            `;
        }

        // Filtrar profesores
        function filterTeachers() {
            const search = document.getElementById('filterSearch').value.toLowerCase();
            const specialty = document.getElementById('filterSpecialty').value.toLowerCase();
            const priceRange = document.getElementById('filterPrice').value;
            
            let filtered = allTeachers;
            
            if (search) {
                filtered = filtered.filter(t => 
                    t.name.toLowerCase().includes(search) ||
                    (t.bio && t.bio.toLowerCase().includes(search))
                );
            }
            
            if (specialty) {
                filtered = filtered.filter(t => 
                    t.specialties.some(s => s.toLowerCase().includes(specialty))
                );
            }
            
            if (priceRange) {
                const [min, max] = priceRange.split('-').map(Number);
                filtered = filtered.filter(t => t.pricePerClass >= min && t.pricePerClass <= max);
            }
            
            renderTeachers(filtered);
        }

        // Event listeners para filtros
        document.getElementById('filterSearch').addEventListener('input', filterTeachers);
        document.getElementById('filterSpecialty').addEventListener('change', filterTeachers);
        document.getElementById('filterPrice').addEventListener('change', filterTeachers);

        // Cargar al inicio
        loadTeachers();
    </script>
</body>
</html>
