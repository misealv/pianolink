# Fly.io Configuration - PianoLink
# Servidor en São Paulo, Brasil para menor latencia a Chile/Argentina

app = "pianolink-latam"
primary_region = "gru"  # GRU = Guarulhos, São Paulo, Brasil 🇧🇷

[build]
  # Usar Dockerfile
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false    # SIEMPRE activo (como keep-alive de Apps Script)
  auto_start_machines = true
  min_machines_running = 1      # Mínimo 1 máquina siempre corriendo
  
  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

# WebSockets requieren sticky sessions
[http_service.http_options]
  response = { headers = { "X-Frame-Options" = "SAMEORIGIN" } }

# Configuración de la máquina virtual
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Health checks para Socket.IO
[[services]]
  protocol = "tcp"
  internal_port = 3000
  
  [[services.ports]]
    port = 80
    handlers = ["http"]
  
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  
  # Health check básico
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
